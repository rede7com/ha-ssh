name: "HA SSH"
version: "1.0.0"
slug: ha_ssh
description: "Acesso SSH root por chave ao Home Assistant, com docker e API do Supervisor"
url: "https://github.com/rede7com/ha-ssh"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: services
boot: auto
init: false
full_access: true
apparmor: false
homeassistant_api: true
hassio_api: true
hassio_role: admin
docker_api: true
host_network: true
map:
  - config:rw
  - homeassistant_config:rw
  - ssl:rw
  - all_addon_configs:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw
options:
  ssh_port: 2222
  ssh_authorized_key: ""
schema:
  ssh_port: "int(1024,65535)"
  ssh_authorized_key: "str"
